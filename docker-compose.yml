services:
  backend:
    build:
      context: ./backend
    container_name: post-monitoring-backend
    working_dir: /app
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
    container_name: post-monitoring-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/package.json:/app/package.json
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend
